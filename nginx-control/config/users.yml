# ──────────────────────────────────────────────────────────────────────────────
# Nginx Dashboard — Utilisateurs
# ──────────────────────────────────────────────────────────────────────────────
#
# Rôles disponibles :
#   admin    → accès complet (métriques, configs, logs, SSL, reload, webhooks,
#              gestion des sessions, API hash)
#   operator → métriques + configs + logs + SSL + reload nginx (pas webhooks)
#   viewer   → métriques + configs + logs + SSL (lecture seule, pas de reload)
#
# Format du mot de passe :
#   sha256:<salt>:<hash>   → généré par l'API POST /api/auth/hash
#                          → ou en mettant un mot de passe en clair ici :
#                            le serveur le hash automatiquement au premier
#                            démarrage et réécrit ce fichier.
#
# Exemple pour générer un hash manuellement (curl) :
#   curl -s -X POST http://localhost:3000/api/auth/hash \
#     -H "Authorization: Bearer <API_TOKEN>" \
#     -H "Content-Type: application/json" \
#     -d '{"password":"monmotdepasse"}' | jq .digest
#
# SECURITE (v12.21.1) : tant qu'un compte ci-dessous garde son mot de passe
# d'exemple (admin/admin, operator123, viewer123 — publics, documentes dans
# ce depot), le dashboard l'affiche a chaque demarrage dans ses logs et cree
# un evenement "auth.default_credentials" visible dans le journal. Changez-les
# des le premier login (page Utilisateurs).
# ──────────────────────────────────────────────────────────────────────────────

users:
  - username: admin
    # Mot de passe par défaut : admin
    # CHANGER IMMÉDIATEMENT en production !
    password: admin
    role: admin
    name: Administrateur
    enabled: true

  - username: operator
    # Mot de passe par défaut : operator123
    password: operator123
    role: operator
    name: Opérateur
    enabled: true

  - username: viewer
    # Mot de passe par défaut : viewer123
    password: viewer123
    role: viewer
    name: Lecteur
    enabled: true
