# error-pages (tarampampam/error-pages) — pages d erreur personnalisees,
# gerees comme les autres conteneurs annexes depuis le dashboard.
#
# Contrairement a certbot et geoipupdate, ce conteneur n a ni secret ni
# volume : il ne fait que rendre un theme HTML a partir du code HTTP recu
# (en-tete X-Code), sans rien ecrire sur disque. Rien a proteger, rien a
# faire correspondre a un chemin hote.
#
# Cote nginx, le cablage est deja fourni tel quel dans global-error.conf
# (exemple du projet) : il attend un conteneur joignable sous le nom
# "error-pages" sur le port 8080 — c est pourquoi ce conteneur est cree ici
# sous ce nom Docker exact, plutot que prefixe "nginx-dashboard-..." comme
# les autres conteneurs geres par le dashboard. Rien a modifier dans
# global-error.conf si vous utilisez la config nginx fournie en exemple.

enable: false

# Image du conteneur
container_image: tarampampam/error-pages:latest

# Theme visuel. Liste complete et captures d ecran :
# https://github.com/tarampampam/error-pages#-templates
# Quelques valeurs courantes : connection, l7, ghost, shuffle, matrix,
# hacker-terminal, orient, lost-in-space, cats, noise.
template_name: connection
