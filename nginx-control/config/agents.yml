# Hotes Docker distants (agents) — voir README.md ("Partie 2 : hotes Docker
# distants") et le document de conception du projet.
#
# enable: active/desactive entierement l'enrolement et l'acceptation de
# manifestes d'agents. Les vhosts deja generes par un agent ne sont ni
# supprimes ni modifies quand enable passe a false — ils restent tels quels
# jusqu au prochain manifeste accepte apres reactivation.
# Desactive par defaut (v12.41.0) : fonctionnalite opt-in — passer a true
# pour l activer explicitement.
enable: false

# offline_after_sec : au-dela de ce delai sans manifeste recu (chaque push
# vaut heartbeat), un agent approuve est affiche "hors ligne" dans la page
# Agents. Ses vhosts deja generes restent en place tels quels (voir le
# document de conception : jamais de suppression automatique sur un simple
# flap reseau) — seule une revocation explicite ou un manifeste vide envoye
# par l agent lui-meme les retire.
offline_after_sec: 90

# max_vhosts_per_agent : plafond anti-abus. Un manifeste depassant ce nombre
# de vhosts est rejete en bloc (voir lib/agent-manifest.js#validateManifest)
# plutot que tronque silencieusement.
max_vhosts_per_agent: 50

# tunnel_enable : active le mode 3 (tunnel NAT sortant, voir
# features/agent-tunnel.js) — un agent derriere NAT, sans port entrant
# ouvert, peut publier ses services en ouvrant lui-meme une connexion
# WebSocket sortante vers ce dashboard. Sans effet sur les agents en mode
# direct (le seul mode existant avant cette version).
tunnel_enable: true

# tunnel_target : l adresse interne (telle que NGINX peut la joindre, sur le
# meme reseau Docker) du dashboard lui-meme — c est vers cette adresse que
# les vhosts generes en mode tunnel font leur proxy_pass ; le dashboard
# route ensuite la requete vers le bon agent via le tunnel WebSocket ouvert
# par cet agent. A adapter uniquement si le service nginx-dashboard porte un
# autre nom/port dans votre docker-compose.yml.
tunnel_target: http://nginx-dashboard:3000

# certbot_retry_minutes : pour les vhosts d agent avec sslCertificate=
# certbot_http ou certbot_dns (v12.21.0), delai minimum avant de RE-tenter
# une emission de certificat apres un echec — meme reglage et meme raison
# que config/docker-autoconfig.yml#certbot_retry_minutes (ne jamais saturer
# les limites de debit reelles de Let's Encrypt). Un premier essai (aucun
# echec precedent enregistre) n est jamais retarde par ce reglage.
certbot_retry_minutes: 15
