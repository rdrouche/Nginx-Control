# Integration CrowdSec (page CrowdSec) — deux sources independantes,
# utilisables ensemble ou separement :
#
#   - Prometheus (prometheus_url) : metriques de l agent local, jamais
#     transmises hors de la machine. Source privilegiee : plus riche, et
#     purement locale.
#   - LAPI (url + api_key) : decisions/alertes en direct, necessaires pour
#     lister les adresses bannies (Prometheus ne donne que des compteurs).
#
# Tous les champs sont optionnels : un champ absent ici retombe sur la
# variable Docker correspondante (CROWDSEC_URL, CROWDSEC_API_KEY, ...) si
# elle est definie. Quand un champ EST renseigne ici, il prend le dessus.
# Modifiable depuis la page Configuration, sans redemarrer le conteneur.

# URL de la Local API CrowdSec (ex: http://crowdsec:8080)
url:

# Cle API du bouncer — lecture seule par conception CrowdSec (voir
# `cscli bouncers add`). Jamais affichee en clair une fois enregistree.
api_key:

# URL du endpoint /metrics Prometheus de l agent CrowdSec local
prometheus_url:

# true : masque tout ce qui vient de la CAPI (liste communautaire centrale),
# n affiche que les decisions/bannissements locaux a cette machine.
# Laisser vide pour garder la valeur actuelle (variable Docker
# CROWDSEC_LOCAL_ONLY, false par defaut) — mettre true ou false ici la
# remplace explicitement.
local_only:

# Identifiant "machine" (watcher) — necessaire uniquement pour bannir/debannir
# depuis le dashboard (creation via `cscli machines add <name> --password
# <secret>` sur l hote CrowdSec ; jamais --auto, qui genere un mot de passe
# non affiche). Distinct de la cle bouncer ci-dessus : CrowdSec separe
# volontairement lecture (bouncer) et ecriture (machine).
machine_id:

# Mot de passe correspondant, jamais affiche en clair une fois enregistre.
machine_password:
