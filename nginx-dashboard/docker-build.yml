name: Docker Build on Tag
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag Docker à build (ex: 11.0.0)'
        required: true
        type: string
        default: 'manual-build'
jobs:
  build-and-push:
    runs-on: docker
    container:
      image: docker:latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Install Node.js
        run: apk add --no-cache nodejs

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Forgejo Registry
        run: echo "${{ secrets.REPO_TOKEN }}" | docker login ${{ github.server_url }} -u ${{ github.actor }} --password-stdin

      - name: Build and Push
        run: |
          REGISTRY="forge.rdr-it.com/dockerfiles/nginx-reverse-proxy-dashboard"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi

          IMAGE_LOCAL="${REGISTRY}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          docker build \
            --build-arg APP_VERSION=${TAG_NAME} \
            --build-arg APP_REVISION=${{ github.sha }} \
            --build-arg APP_CREATED=${BUILD_DATE} \
            -t $IMAGE_LOCAL:$TAG_NAME \
            --build-arg DASHBOARD_VERSION_URL=https://forge.rdr-it.com/romain/Docker-Compose/raw/branch/main/nginx-dashboard-current-version \
            --build-arg NGINX_VERSION_URL=https://forge.rdr-it.com/romain/Docker-Compose/raw/branch/main/nginx-rproxy-current-version \
            --build-arg BRANDING_SITE=https://rdr-it.com \
            --build-arg BRANDING_SITE_LABEL=RDR-IT \
            --build-arg BRANDING_REPO=https://forge.rdr-it.com/Dockerfiles/nginx-reverse-proxy-dashboard \
            -f nginx-dashboard/Dockerfile nginx-dashboard/

          docker push $IMAGE_LOCAL:$TAG_NAME

      # Vérification post-build — confirme que les labels sont bien présents
      - name: Verify labels
        run: |
          REGISTRY="forge.rdr-it.com/dockerfiles/nginx-reverse-proxy-dashboard"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          echo "=== Labels de l'image buildée ==="
          docker inspect $REGISTRY:$TAG_NAME \
            --format '{{range $k,$v := .Config.Labels}}{{$k}}={{$v}}{{"\n"}}{{end}}' \
            | grep opencontainers
