# Depot Git utilise pour le deploiement de configuration et les sauvegardes
# (page Deploiement Git) — le meme depot est aussi utilise par la
# synchronisation des fichiers de reference (page Sync fichiers ref) pour
# committer/pousser ses mises a jour.
#
# Tous les champs ci-dessous sont optionnels : un champ absent ici retombe
# sur la variable Docker correspondante (GIT_REPO_URL, GIT_BRANCH, ...) si
# elle est definie — rien ne casse pour un deploiement deja configure en
# .env. Quand un champ EST renseigne ici, il prend le dessus sur la
# variable Docker. Modifiable depuis la page Configuration, sans redemarrer
# le conteneur.

# URL HTTPS ou SSH du depot (ex: https://forge.example.com/moi/nginx-config.git)
repo_url:

# Branche principale suivie par Pull/Deploiement.
# Laisser vide pour garder la valeur actuelle (variable Docker GIT_BRANCH,
# "main" par defaut) — un nom renseigne ici la remplace explicitement.
branch:

# Branche dediee aux sauvegardes automatiques (tags backup/<horodatage>).
# Laisser vide pour garder la valeur actuelle (variable Docker
# GIT_BACKUP_BRANCH, "backup" par defaut).
backup_branch:

# Authentification HTTPS — jeton d acces personnel avec droit d ecriture sur
# le depot (jamais affiche en clair une fois enregistre : voir la section
# Securite du README). Laisser vide pour une authentification SSH a la place.
token:

# Authentification SSH — reste exclusivement la variable Docker GIT_SSH_KEY
# (chemin, vu depuis ce conteneur, vers une cle privee montee en lecture
# seule) : c est un chemin de montage fixe par docker-compose.yml, pas un
# reglage a changer depuis cette page. Laisser `token` vide pour l utiliser.

# Identite utilisee pour les commits automatiques (sync, sauvegardes).
# Laissees vides pour garder les valeurs actuelles (variables Docker
# GIT_USER_NAME/GIT_USER_EMAIL, "Nginx Dashboard"/"dashboard@localhost" par
# defaut).
user_name:
user_email:
