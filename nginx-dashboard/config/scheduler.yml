# Scheduler — Nginx Dashboard
# Cron format: "minute hour day month weekday"
# Examples:
#   "0 3 * * *"   = every day at 3:00
#   "0 */6 * * *" = every 6 hours
#   "30 2 * * 0"  = every Sunday at 2:30

nginx_reload:
  enable: false
  cron: "0 3 * * *"
  notify: true

nginx_restart:
  # Restarts the whole nginx container, not just `nginx -s reload` — for
  # what a reload cannot fix: a stuck worker, a leaked file descriptor,
  # memory only a fresh process reclaims. Same `nginx -t` safety check as
  # nginx_reload above runs first; the restart is skipped if it fails.
  enable: false
  cron: "0 4 * * 0"   # chaque dimanche a 4h
  grace_seconds: 10    # delai avant l arret force du conteneur (SIGKILL)
  notify: true

digest:
  # Resume periodique — trafic, robots, CrowdSec, WAF, certificats — assemble
  # depuis ce que le dashboard calcule deja ailleurs. Visible dans le
  # dashboard (page "Resume") des sa generation ; envoye par mail en plus si
  # notify:true et au moins un destinataire.
  #
  # `cron` decide QUAND il se declenche, `period_hours` decide QUELLE FENETRE
  # il couvre — les deux doivent rester coherents, ou le resume manque une
  # partie de la periode (hebdomadaire mais period_hours:24 ne couvrirait
  # que le dernier jour, six jours dans l angle mort) ou en repete une autre
  # (quotidien mais period_hours:168 re-couvrirait chaque jour six fois).
  #
  # Exemple ci-dessous : hebdomadaire, chaque lundi a 7h, sur les 7 derniers
  # jours (168h). Pour un quotidien a la place : cron "0 7 * * *" (tous les
  # jours a 7h) avec period_hours: 24.
  enable: false
  cron: "0 7 * * 1"    # chaque lundi a 7h
  period_hours: 168     # fenetre couverte par le resume : 24 pour un quotidien, 168 pour une semaine
  notify: false
  recipients:
    - admin@example.com

backup:
  enable: false
  cron: "0 2 * * *"
  mode: local
  notify_on_failure: true

goaccess_restart:
  enable: false
  cron: "0 4 * * 0"   # chaque dimanche a 4h
  # sources: []        # vide = tous les conteneurs GoAccess actifs
  # sources:           # ou lister les IDs de sources specifiques
  #   - example.com
  #   - api.example.com
