# Certbot — defi DNS-01 (multi-fournisseurs, wildcards, plusieurs certificats)
#
# Complementaire au defi HTTP-01 (certbot.yml), pas un remplacement : utile
# pour les certificats wildcard (*.exemple.com), impossibles a obtenir via
# HTTP-01, ou quand le port 80 n est pas expose publiquement.
#
# Vrai Let's Encrypt de production uniquement — pas de --staging ici, le defi
# DNS sert les enregistrements publics reels (voir le README pour le detail).
#
# Fonctionne dans un conteneur SEPARE de celui du defi HTTP (certbot.yml) :
# image differente (le plugin DNS doit y etre installe), pas de webroot a
# monter, identifiants dedies. Les deux peuvent tourner en meme temps sans
# se marcher dessus tant qu un meme domaine n est jamais demande par les deux
# methodes (voir "risque de conflit" dans le README).

enable: false

# Fournisseur DNS. Valeurs reconnues avec des reglages par defaut deja
# corrects : cloudflare, ovh, digitalocean, google.
# Un fournisseur non liste fonctionne aussi : laissez provider a "custom" et
# renseignez vous-meme container_image, plugin_flag, credentials_flag et
# propagation_flag plus bas (voir la liste des plugins officiels certbot-dns-*).
provider: cloudflare

# Image a utiliser. Vide = valeur par defaut du fournisseur ci-dessus
# (ex. certbot/dns-cloudflare:latest).
container_image:

email: admin@example.com

# Secondes d attente apres la publication de l enregistrement DNS avant que
# certbot ne demande la validation, le temps que le changement se propage
# chez le fournisseur. Ignore par les fournisseurs qui n en ont pas besoin.
propagation_seconds: 30

# ── Chemins HOTE (indispensables) ────────────────────────────────────────────
# Docker resout les sources de montage sur l HOTE. Un chemin qui n existe que
# dans le conteneur du dashboard ferait monter un dossier vide.
#
# credentials_host_path : fichier contenant le jeton/la cle API du
# fournisseur (format specifique a chaque fournisseur — voir le README).
# Gere entierement par vous, hors du dashboard : comme pour license_key
# (geoipupdate) ou ca_bundle_host_path (certbot HTTP), un secret de ce type
# n est jamais lu ni ecrit par une route du dashboard.
credentials_host_path: /containers/nginx-rproxy/dns-credentials/credentials.ini

# certs_host_path : DOIT pointer vers le MEME dossier hote que celui monte
# en ./certs dans docker-compose.yml (le meme que certbot.yml y utilise) —
# les certificats HTTP et DNS partagent le meme magasin /etc/letsencrypt,
# c est le fonctionnement normal de certbot, pas une fusion a faire a la main.
certs_host_path: /containers/nginx-rproxy/certs

# ── Reglages manuels pour un fournisseur non liste dans "provider" ci-dessus ─
# Ignores si "provider" correspond a une valeur reconnue.
# plugin_flag:       --dns-monfournisseur
# credentials_flag:  --dns-monfournisseur-credentials
# propagation_flag:  --dns-monfournisseur-propagation-seconds
