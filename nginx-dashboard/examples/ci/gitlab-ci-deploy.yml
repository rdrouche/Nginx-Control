# Exemple GitLab CI — declenche un test puis un deploiement Git du
# dashboard nginx-dashboard via son API. Voir examples/ci/README.md pour la
# creation du jeton et des variables CI/CD DASHBOARD_URL / DEPLOY_TOKEN_*.
#
# A copier en tant que .gitlab-ci.yml (ou l inclure via `include:`) dans le
# depot de CONFIGURATION nginx (celui que le dashboard suit via
# config/git.yml), pas dans le depot du dashboard lui-meme.
#
# Variables CI/CD a definir (Settings -> CI/CD -> Variables), toutes
# "Masked" et "Protected" pour DEPLOY_TOKEN_DEPLOY :
#   DASHBOARD_URL         ex. https://dashboard.example.com
#   DEPLOY_TOKEN_TEST     jeton limite a l action "test"
#   DEPLOY_TOKEN_DEPLOY   jeton complet (pull/test/deploy/backup)

stages:
  - test
  - deploy

test-config:
  stage: test
  # Tourne sur chaque push et chaque merge request : le jeton limite a
  # "test" ne peut jamais declencher un vrai deploiement.
  image: curlimages/curl:latest
  script:
    - >
      http_code=$(curl -sS -o response.json -w '%{http_code}' -X POST
      -H "Authorization: Bearer ${DEPLOY_TOKEN_TEST}"
      "${DASHBOARD_URL}/api/git/test")
    - echo "--- reponse (${http_code}) ---"
    - cat response.json
    - |
      if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
        echo "Test de configuration echoue (HTTP ${http_code})"
        exit 1
      fi

deploy-config:
  stage: deploy
  image: curlimages/curl:latest
  # Seulement sur la branche principale, jamais sur une merge request —
  # jeton complet, reserve a ce job protege.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  script:
    - >
      http_code=$(curl -sS -o response.json -w '%{http_code}' -X POST
      -H "Authorization: Bearer ${DEPLOY_TOKEN_DEPLOY}"
      "${DASHBOARD_URL}/api/git/deploy")
    - echo "--- reponse (${http_code}) ---"
    - cat response.json
    - |
      if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
        echo "Deploiement echoue (HTTP ${http_code}) — voir response.json ci-dessus"
        exit 1
      fi
      echo "Deploiement reussi."
