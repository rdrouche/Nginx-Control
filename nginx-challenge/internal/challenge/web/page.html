<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{.Text.Title}}</title>
<link rel="stylesheet" href="{{.Assets}}style.css">
</head>
<body>
<main id="nc" data-target="{{.Target}}" data-assets="{{.Assets}}" data-lang="{{.Lang}}">
  <h1 id="nc-title">{{.Text.Heading}}</h1>
  <p id="nc-msg">{{.Text.Msg}}</p>
  <div class="bar"><div id="nc-bar"></div></div>
  <noscript><p class="err">{{.Text.NoScript}}</p></noscript>
  <p><button id="nc-retry" type="button" hidden>{{.Text.Retry}}</button></p>
</main>
<script src="{{.Assets}}challenge.js"></script>
</body>
</html>
